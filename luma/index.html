<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="LUMA — 一个现代简约、动画丝滑的流媒体界面演示。零依赖。">
  <title>LUMA — 流光媒体</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4633A'/%3E%3Cpath d='M13 10.5v11l9-5.5z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (() => {
      const t = localStorage.getItem('luma-theme');
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Left rail (desktop) / bottom bar (mobile) -->
  <nav class="rail" id="rail" aria-label="主导航">
    <a class="rail-logo" href="#" aria-label="LUMA 首页">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="rail-label logo-word">LUMA</span>
    </a>
    <div class="rail-group">
      <button class="rail-item is-active" aria-current="page" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
        <span class="rail-label">首页</span>
      </button>
      <button class="rail-item" data-nav="explore">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m14.8 9.2-1.7 4-4 1.7 1.7-4z"/></svg>
        <span class="rail-label">探索</span>
      </button>
      <button class="rail-item" data-nav="subs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M7 5h10M9 2.5h6"/><path d="m11 12 4 2-4 2z" class="fill"/></svg>
        <span class="rail-label">订阅</span>
      </button>
      <button class="rail-item" data-nav="library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h2v16H5zM10 4h2v16h-2z"/><path d="m15 5 5 14-2 .8L13 5.8z"/></svg>
        <span class="rail-label">媒体库</span>
      </button>
    </div>
    <div class="rail-foot">
      <button class="rail-item" data-action="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6 5.5 5.5"/></svg>
        <span class="rail-label">设置</span>
      </button>
    </div>
  </nav>

  <!-- Top bar -->
  <header class="topbar">
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索视频、频道…  ( / )" aria-label="搜索">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" aria-label="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" id="uploadBtn" aria-label="上传">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5"/><path d="M5 19h14"/></svg>
      </button>
      <button class="avatar" id="avatarBtn" aria-expanded="false" aria-label="账户菜单">L</button>
      <div class="menu" id="avatarMenu" hidden>
        <button>个人资料</button>
        <button>切换账户</button>
        <hr>
        <button>退出登录</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="content" id="content">
    <div class="chips" id="chips" role="toolbar" aria-label="内容筛选"></div>
    <h2 class="section-title" id="sectionTitle">为你推荐</h2>
    <section class="grid" id="grid" aria-live="polite"></section>
    <div class="grid-empty" id="gridEmpty" hidden></div>
  </main>

  <!-- Watch overlay -->
  <div class="watch" id="watch" role="dialog" aria-modal="true" aria-labelledby="watchTitle" hidden>
    <div class="watch-scrim" data-close></div>
    <article class="watch-panel" tabindex="-1">
      <div class="player" id="player">
        <button class="player-play" id="playerPlay" aria-label="播放 / 暂停">
          <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13l11-6.5z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5h2.8v13H8zM13.2 5.5H16v13h-2.8z"/></svg>
        </button>
        <div class="player-bar"><div class="player-progress" id="playerProgress"></div></div>
        <span class="player-time mono" id="playerTime">00:00</span>
      </div>
      <div class="watch-body">
        <div class="watch-info">
          <h3 id="watchTitle"></h3>
          <p class="watch-meta mono" id="watchMeta"></p>
          <div class="watch-channel">
            <span class="channel-avatar" id="watchAvatar" aria-hidden="true"></span>
            <div class="channel-names">
              <strong id="watchChannel"></strong>
              <span class="mono" id="watchSubs"></span>
            </div>
            <button class="btn btn-primary" id="subscribeBtn">订阅</button>
          </div>
          <div class="watch-actions">
            <button class="btn" data-toast="已点赞,好品味。">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1zM7 11l4.2-7.2a1.8 1.8 0 0 1 3.3 1.2L14 9h5a2 2 0 0 1 2 2.4l-1.2 6A2 2 0 0 1 17.8 19H7"/></svg>
              喜欢
            </button>
            <button class="btn" data-toast="已保存到「稍后观看」。">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4.5L6 20z"/></svg>
              收藏
            </button>
            <button class="btn" data-toast="链接已复制到剪贴板。">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 10.5 21 3M15 3h6v6"/><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/></svg>
              分享
            </button>
          </div>
        </div>
        <aside class="related" id="related" aria-label="相关推荐"></aside>
      </div>
      <button class="icon-btn watch-close" data-close aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </article>
  </div>

  <!-- Mini player -->
  <div class="mini" id="mini" hidden>
    <span class="mini-thumb" id="miniThumb" aria-hidden="true"></span>
    <div class="mini-text">
      <strong id="miniTitle"></strong>
      <span class="mono" id="miniChannel"></span>
    </div>
    <button class="icon-btn" id="miniExpand" aria-label="展开播放器">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15 3.5 20.5M8 20.5H3.5V16M15 9l5.5-5.5M16 3.5h4.5V8"/></svg>
    </button>
    <button class="icon-btn" id="miniClose" aria-label="关闭迷你播放器">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
